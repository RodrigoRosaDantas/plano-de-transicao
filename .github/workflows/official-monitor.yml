name: Radar Oficial DOU e DODF

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. 09h–21h UTC = 06h–18h em Brasília.
    # Varredura horária durante manhã/tarde + fechamento noturno às 21h15 BRT.
    - cron: "15 9-21 * * *"
    - cron: "15 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-monitor.yml"
      - "scripts/official-monitor.mjs"

permissions:
  contents: read
  id-token: write

concurrency:
  group: official-monitor
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Preparar leitor PDF quando necessário
        run: |
          hour="$(TZ=America/Sao_Paulo date +%H)"
          if [[ "$hour" == "06" || "$hour" == "18" || "$hour" == "21" ]]; then
            command -v pdftotext >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          else
            echo "Varredura horária leve: PDF certificado não é sondado neste horário."
          fi

      - name: Varrer DOU e DODF
        run: node scripts/official-monitor.mjs
