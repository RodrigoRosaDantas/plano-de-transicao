name: Sincronizar Notion e publicar
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-notion.yml'
      - 'scripts/sync-notion.mjs'
      - '.sync-trigger'
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar dados do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs
      - name: Commit de atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notion-live.json data/snapshot.json
          git diff --cached --quiet || git commit -m "chore: sincroniza Notion"
          git push
