name: Sincronizar Notion e publicar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-notion.yml'
      - 'scripts/sync-notion.mjs'
      - '.sync-trigger'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: plano-transicao-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar dados do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-notion.mjs
      - name: Commit de atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notion-live.json data/snapshot.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de dados."
            exit 0
          fi
          git commit -m "chore: sincroniza Notion"
          git pull --rebase origin main
          git push origin HEAD:main
