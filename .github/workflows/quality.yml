name: Qualidade e paridade gerencial

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/snapshot.json'
      - 'data/treated-performance-data.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/audit-parity.mjs'
      - 'scripts/audit-v13.mjs'
      - 'scripts/audit-v14.mjs'
      - 'scripts/audit-v15.mjs'
      - 'tests/**'
      - '.github/workflows/quality.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: plano-transicao-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditoria de dados e paridade
        run: node scripts/audit-parity.mjs
      - name: Auditoria estrutural da v13
        run: node scripts/audit-v13.mjs
      - name: Auditoria estrutural da v14
        run: node scripts/audit-v14.mjs
      - name: Auditoria estrutural da v15
        run: node scripts/audit-v15.mjs
      - name: Auditoria do Dia da Prova v19
        run: node tests/v19-exam-day.mjs
      - name: Auditoria do horário da aplicação v20
        run: node tests/v20-application-time.mjs
      - name: Auditoria estática da aba Dia da Prova v21
        run: node tests/v21-exam-day-tab-static.mjs
      - name: Auditoria estática do polimento v22
        run: node tests/v22-exam-day-polish-static.mjs
      - name: Auditoria estática do workspace v23
        run: node tests/v23-workspace-static.mjs
      - name: Auditoria estática do refinamento v26
        run: node tests/v26-visual-polish-static.mjs

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Servir aplicação local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/plano-http.log 2>&1 &
          echo $! > /tmp/plano-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/plano-http.log
          exit 1
      - name: Testes da central, atualização, desempenho, operações e responsividade
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/ui-smoke.mjs
      - name: Testes da aba Dia da Prova v21
        id: v21
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/v21-exam-day-tab.mjs
      - name: Testes do polimento visual v22
        id: v22
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/v22-exam-day-polish.mjs
      - name: Testes do redesign workspace v23
        id: v23
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/v23-workspace-ui.mjs
      - name: Testes do refinamento visual v26
        id: v26
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/v26-visual-polish-ui.mjs
      - name: Testes específicos da caixa gerencial v13
        id: v13
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/v13-inbox.mjs
      - name: Testes específicos do modo foco v14
        id: v14
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/v14-focus.mjs
      - name: Testes específicos do fechamento do ciclo v15
        id: v15
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node tests/v15-transition-gate.mjs
      - name: Evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Consolidar resultado da UI
        if: always()
        run: |
          failed=0
          for outcome in \
            "${{ steps.smoke.outcome }}" \
            "${{ steps.v21.outcome }}" \
            "${{ steps.v22.outcome }}" \
            "${{ steps.v23.outcome }}" \
            "${{ steps.v26.outcome }}" \
            "${{ steps.v13.outcome }}" \
            "${{ steps.v14.outcome }}" \
            "${{ steps.v15.outcome }}"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Uma ou mais suítes de UI falharam. Consulte os passos acima e os screenshots."
            exit 1
          fi
          echo "Todas as suítes de UI passaram."
